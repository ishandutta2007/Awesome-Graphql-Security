<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0B0F19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1F1147"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#E535AB"/><stop offset="50%" stop-color="#A855F7"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient><linearGradient id="accentGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#E535AB" stop-opacity=".3"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse{0%{transform:scale(.98);opacity:.8}}@keyframes float{0%{transform:translateY(0)}}.bg-grid{stroke:rgba(255,255,255,.04);stroke-width:1}.shield-pulse{animation:pulse 3s ease-in-out infinite alternate;transform-origin:1050px 160px}.data-stream{stroke-dasharray:8 8;animation:dash 15s linear infinite}.node-pulse{animation:float 4s ease-in-out infinite alternate}</style></defs><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><g class="bg-grid"><line x1="0" x2="1200" y1="40" y2="40"/><line x1="0" x2="1200" y1="100" y2="100"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="220" y2="220"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="150" x2="150" y1="0" y2="320"/><line x1="350" x2="350" y1="0" y2="320"/><line x1="550" x2="550" y1="0" y2="320"/><line x1="750" x2="750" y1="0" y2="320"/><line x1="950" x2="950" y1="0" y2="320"/><line x1="1150" x2="1150" y1="0" y2="320"/></g><path fill="none" stroke="#E535AB" stroke-opacity=".25" stroke-width="2" d="M -50 260 Q 250 300 500 220 T 1050 160" class="data-stream"/><path fill="none" stroke="#3B82F6" str