<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1F1147" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E535AB" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E535AB" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      .shield-pulse { animation: pulse 3s ease-in-out infinite alternate; transform-origin: 1050px 160px; }
      .data-stream { stroke-dasharray: 8 8; animation: dash 15s linear infinite; }
      .node-pulse { animation: float 4s ease-in-out infinite alternate; }
      
      @keyframes pulse {
        0% { transform: scale(0.98); opacity: 0.8; }
        100% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 0 15px rgba(229, 53, 171, 0.6)); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16" />

  <!-- Background Grid & Dynamic Waves (in background behind text) -->
  <g class="bg-grid">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    
    <line x1="150" y1="0" x2="150" y2="320" />
    <line x1="350" y1="0" x2="350" y2="320" />
    <line x1="550" y1="0" x2="550" y2="320" />
    <line x1="750" y1="0" x2="750" y2="320" />
    <line x1="950" y1="0" x2="950" y2="320" />
    <line x1="1150" y1="0" x2="1150" y2="320" />
  </g>

  <!-- Dynamic background animated network streams (kept far background) -->
  <path class="data-stream" d="M -50 260 Q 250 300 500 220 T 1050 160" fill="none" stroke="#E535AB" stroke-opacity="0.25" stroke-width="2" />
  <path class="data-stream" d="M -50 80 Q 350 20 700 120 T 1250 80" fill="none" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="2" />

  <!-- Graphic Decorative Element: Right Side GraphQL Node & Shield Graphic (Away from text) -->
  <g class="shield-pulse" transform="translate(0, 0)">
    <!-- Shield Outer -->
    <path d="M 1050 70 L 1130 100 V 170 C 1130 220 1050 250 1050 250 C 1050 250 970 220 970 170 V 100 Z" 
          fill="url(#accentGlow)" stroke="#E535AB" stroke-width="2.5" />
    <!-- GraphQL Hexagon Node inside Shield -->
    <polygon points="1050,110 1090,133 1090,178 1050,200 1010,178 1010,133" 
             fill="none" stroke="#A855F7" stroke-width="2" opacity="0.9" />
    <circle cx="1050" cy="110" r="5" fill="#E535AB" />
    <circle cx="1090" cy="133" r="5" fill="#E535AB" />
    <circle cx="1090" cy="178" r="5" fill="#E535AB" />
    <circle cx="1050" cy="200" r="5" fill="#E535AB" />
    <circle cx="1010" cy="178" r="5" fill="#E535AB" />
    <circle cx="1010" cy="133" r="5" fill="#E535AB" />
    <line x1="1050" y1="110" x2="1090" y2="178" stroke="#3B82F6" stroke-width="1.5" />
    <line x1="1090" y1="133" x2="1010" y2="178" stroke="#3B82F6" stroke-width="1.5" />
    <line x1="1010" y1="133" x2="1050" y2="200" stroke="#3B82F6" stroke-width="1.5" />
  </g>

  <!-- Foreground Title and Subtitle Text (Guaranteed 100% visible and un-obscured) -->
  <g transform="translate(60, 0)">
    <!-- Badge Pill above Title -->
    <g transform="translate(0, 52)" class="node-pulse">
      <rect width="210" height="28" rx="14" fill="#E535AB" fill-opacity="0.15" stroke="#E535AB" stroke-opacity="0.4" stroke-width="1" />
      <text x="105" y="18" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
        SECURITY ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome GraphQL Security
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Curated SaaS Platforms, Enterprise Protection &amp; Open-Source Defense Tools
    </text>

    <!-- Feature Tag Chips -->
    <g transform="translate(0, 215)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="150" height="32" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1" />
      <text x="75" y="20" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Runtime Defense</text>

      <!-- Tag 2 -->
      <rect x="162" y="0" width="165" height="32" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1" />
      <text x="244" y="20" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Query Cost Limits</text>

      <!-- Tag 3 -->
      <rect x="339" y="0" width="160" height="32" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1" />
      <text x="419" y="20" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔍 Schema Auditing</text>

      <!-- Tag 4 -->
      <rect x="511" y="0" width="155" height="32" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1" />
      <text x="588" y="20" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 Open-Source</text>
    </g>
  </g>
</svg>
